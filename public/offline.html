<!doctype html>
<!-- The page the service worker (public/sw.js) shows when the network is out and the page asked for was never read on
     this device (TODO #81). Served at the address asked for: French, or English under /en/ (the script below). It lists
     the pages kept on the device, read from the service worker's cache. Self-contained: no hashed file of the site,
     which may not be kept either. -->
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#1b1e15" />
    <title>Hors ligne · Écluse 21</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        color-scheme: dark;
        --surface: #12140e;
        --on-surface: #ebede3;
        --muted: #c9cdbb;
        --bar: #1b1e15;
        --outline: #3c4232;
        --link: #b8c97a;
        --on-link: #12140e;
      }
      :root[data-theme='light'] {
        color-scheme: light;
        --surface: #f4f4ee;
        --on-surface: #22251b;
        --muted: #4f5444;
        --outline: #c9cbbd;
        --link: #5b6b1f;
        --on-link: #ffffff;
      }
      body {
        margin: 0;
        background: var(--surface);
        color: var(--on-surface);
        font: 400 16px/1.6 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 16px;
        background: var(--bar);
        color: #f2f3ea;
        font: 800 18px/1 ui-monospace, 'Cascadia Mono', Consolas, monospace;
        letter-spacing: 0.5px;
      }
      header img {
        width: 32px;
        height: 32px;
      }
      main {
        max-width: 40rem;
        margin: 0 auto;
        padding: 32px 16px 48px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 32px;
        line-height: 1.2;
        font-weight: 800;
      }
      p {
        margin: 0 0 16px;
        color: var(--muted);
      }
      h2 {
        margin: 32px 0 8px;
        font: 500 12px/16px ui-monospace, 'Cascadia Mono', Consolas, monospace;
        letter-spacing: 1px;
        text-transform: uppercase;
        color: var(--muted);
      }
      ul {
        margin: 0;
        padding: 0;
        list-style: none;
        border-top: 1px solid var(--outline);
      }
      li {
        border-bottom: 1px solid var(--outline);
      }
      li a {
        display: block;
        padding: 12px 0;
        color: var(--link);
        text-decoration: none;
      }
      li a:hover,
      li a:focus-visible {
        text-decoration: underline;
      }
      button {
        min-height: 40px;
        padding: 0 24px;
        border: 0;
        border-radius: 999px;
        background: var(--link);
        color: var(--on-link);
        font: 500 14px/20px system-ui, sans-serif;
        letter-spacing: 0.1px;
        cursor: pointer;
      }
    </style>
    <script>
      try {
        const theme = localStorage.getItem('starlight-theme')
        if (theme === 'light' || (theme !== 'dark' && matchMedia('(prefers-color-scheme: light)').matches)) {
          document.documentElement.dataset.theme = 'light'
        }
      } catch {}
    </script>
  </head>
  <body>
    <header><img src="/favicon.svg" alt="" />ÉCLUSE/21</header>
    <main>
      <h1 data-fr="Hors ligne" data-en="Offline">Hors ligne</h1>
      <p data-fr="Pas de réseau, et cette page n'a pas encore été lue sur cet appareil. Les pages déjà lues restent disponibles." data-en="No network, and this page hasn't been read on this device yet. The pages already read are still available.">Pas de réseau, et cette page n'a pas encore été lue sur cet appareil. Les pages déjà lues restent disponibles.</p>
      <button type="button" data-fr="Réessayer" data-en="Try again" onclick="location.reload()">Réessayer</button>
      <h2 data-fr="Pages sur cet appareil" data-en="Pages on this device" hidden>Pages sur cet appareil</h2>
      <ul hidden></ul>
    </main>
    <script>
      const english = location.pathname === '/en' || location.pathname.startsWith('/en/')
      if (english) {
        document.documentElement.lang = 'en'
        document.title = 'Offline · Lock 21'
        for (const element of document.querySelectorAll('[data-en]')) element.textContent = element.dataset.en
      }
      // The pages kept by the service worker (public/sw.js, cache « lock21-pages-… »), with their titles, in the
      // page's language first
      ;(async () => {
        if (!('caches' in window)) return
        const name = (await caches.keys()).find((key) => key.startsWith('lock21-pages-'))
        if (!name) return
        const cache = await caches.open(name)
        const pages = []
        for (const request of await cache.keys()) {
          const url = new URL(request.url)
          if (url.pathname === '/offline.html') continue
          const response = await cache.match(request)
          const html = response ? await response.text() : ''
          const title = (/<title>([^<]*)<\/title>/.exec(html)?.[1] ?? url.pathname).replace(/&#39;/g, "'").replace(/&amp;/g, '&')
          const isEnglish = url.pathname === '/en/' || url.pathname.startsWith('/en/')
          if (isEnglish === english) pages.push({ href: url.pathname, title })
        }
        if (!pages.length) return
        pages.sort((a, b) => a.title.localeCompare(b.title))
        const list = document.querySelector('ul')
        for (const page of pages) {
          const link = document.createElement('a')
          link.href = page.href
          link.textContent = page.title
          const item = document.createElement('li')
          item.append(link)
          list.append(item)
        }
        list.hidden = false
        document.querySelector('h2').hidden = false
      })()
    </script>
  </body>
</html>
