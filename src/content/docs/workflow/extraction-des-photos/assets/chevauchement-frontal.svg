<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img" aria-labelledby="t d">
  <title id="t">Deux images d'un film qui se recoupent à 85 %</title>
  <desc id="d">En haut, une bande de film: on garde l'image 1 et l'image 9, à un intervalle de 8 images (facteur n8). En bas, les zones filmées par ces deux images: la seconde n'a avancé que de 15 % de la première, elles ont 85 % en commun.</desc>
  <rect width="800" height="520" rx="16" fill="#06121a"/>
  <text x="32" y="44" fill="#9bb8c6" font-family="JetBrains Mono, ui-monospace, monospace" font-size="15" letter-spacing="1">CHEVAUCHEMENT FRONTAL · EXTRACTION DES IMAGES</text>

  <!-- Film strip: 11 frames of 56 x 42 (4:3) every 64 px -->
  <rect x="24" y="70" width="752" height="96" fill="#0e2430" stroke="#2a4a5a" stroke-width="1.5"/>
  <g fill="#06121a">
    <rect x="34" y="76" width="10" height="8" rx="2"/><rect x="66" y="76" width="10" height="8" rx="2"/><rect x="98" y="76" width="10" height="8" rx="2"/>
    <rect x="130" y="76" width="10" height="8" rx="2"/><rect x="162" y="76" width="10" height="8" rx="2"/><rect x="194" y="76" width="10" height="8" rx="2"/>
    <rect x="226" y="76" width="10" height="8" rx="2"/><rect x="258" y="76" width="10" height="8" rx="2"/><rect x="290" y="76" width="10" height="8" rx="2"/>
    <rect x="322" y="76" width="10" height="8" rx="2"/><rect x="354" y="76" width="10" height="8" rx="2"/><rect x="386" y="76" width="10" height="8" rx="2"/>
    <rect x="418" y="76" width="10" height="8" rx="2"/><rect x="450" y="76" width="10" height="8" rx="2"/><rect x="482" y="76" width="10" height="8" rx="2"/>
    <rect x="514" y="76" width="10" height="8" rx="2"/><rect x="546" y="76" width="10" height="8" rx="2"/><rect x="578" y="76" width="10" height="8" rx="2"/>
    <rect x="610" y="76" width="10" height="8" rx="2"/><rect x="642" y="76" width="10" height="8" rx="2"/><rect x="674" y="76" width="10" height="8" rx="2"/>
    <rect x="706" y="76" width="10" height="8" rx="2"/><rect x="738" y="76" width="10" height="8" rx="2"/>
    <rect x="34" y="152" width="10" height="8" rx="2"/><rect x="66" y="152" width="10" height="8" rx="2"/><rect x="98" y="152" width="10" height="8" rx="2"/>
    <rect x="130" y="152" width="10" height="8" rx="2"/><rect x="162" y="152" width="10" height="8" rx="2"/><rect x="194" y="152" width="10" height="8" rx="2"/>
    <rect x="226" y="152" width="10" height="8" rx="2"/><rect x="258" y="152" width="10" height="8" rx="2"/><rect x="290" y="152" width="10" height="8" rx="2"/>
    <rect x="322" y="152" width="10" height="8" rx="2"/><rect x="354" y="152" width="10" height="8" rx="2"/><rect x="386" y="152" width="10" height="8" rx="2"/>
    <rect x="418" y="152" width="10" height="8" rx="2"/><rect x="450" y="152" width="10" height="8" rx="2"/><rect x="482" y="152" width="10" height="8" rx="2"/>
    <rect x="514" y="152" width="10" height="8" rx="2"/><rect x="546" y="152" width="10" height="8" rx="2"/><rect x="578" y="152" width="10" height="8" rx="2"/>
    <rect x="610" y="152" width="10" height="8" rx="2"/><rect x="642" y="152" width="10" height="8" rx="2"/><rect x="674" y="152" width="10" height="8" rx="2"/>
    <rect x="706" y="152" width="10" height="8" rx="2"/><rect x="738" y="152" width="10" height="8" rx="2"/>
  </g>
  <g fill="#1d3e4f">
    <rect x="44" y="97" width="56" height="42"/><rect x="108" y="97" width="56" height="42"/><rect x="172" y="97" width="56" height="42"/>
    <rect x="236" y="97" width="56" height="42"/><rect x="300" y="97" width="56" height="42"/><rect x="364" y="97" width="56" height="42"/>
    <rect x="428" y="97" width="56" height="42"/><rect x="492" y="97" width="56" height="42"/><rect x="556" y="97" width="56" height="42"/>
    <rect x="620" y="97" width="56" height="42"/><rect x="684" y="97" width="56" height="42"/>
  </g>
  <!-- Kept frames: 1 and 9 -->
  <rect x="44" y="97" width="56" height="42" fill="#3cc2bc" fill-opacity="0.35" stroke="#3cc2bc" stroke-width="3"/>
  <rect x="556" y="97" width="56" height="42" fill="#f28c28" fill-opacity="0.3" stroke="#f28c28" stroke-width="3"/>
  <g font-family="JetBrains Mono, ui-monospace, monospace" font-size="13" fill="#9bb8c6" text-anchor="middle">
    <text x="72" y="123">1</text><text x="136" y="123">2</text><text x="200" y="123">3</text><text x="264" y="123">4</text>
    <text x="328" y="123">5</text><text x="392" y="123">6</text><text x="456" y="123">7</text><text x="520" y="123">8</text>
    <text x="584" y="123" fill="#e6eff2">9</text><text x="648" y="123">10</text><text x="712" y="123">11</text>
  </g>
  <!-- Interval of 8 frames -->
  <g stroke="#e6eff2" stroke-width="1.5" fill="none">
    <path d="M72 176 L72 186 L584 186 L584 176"/>
  </g>
  <text x="328" y="208" text-anchor="middle" fill="#e6eff2" font-family="JetBrains Mono, ui-monospace, monospace" font-size="15">intervalle de 8 images (n8)</text>

  <!-- Footprints of the two kept frames on the subject: 400 px long, the second 15 % (60 px) further -->
  <rect x="120" y="260" width="400" height="150" fill="#3cc2bc" fill-opacity="0.22" stroke="#3cc2bc" stroke-width="2"/>
  <rect x="180" y="276" width="400" height="150" fill="#f28c28" fill-opacity="0.18" stroke="#f28c28" stroke-width="2" stroke-dasharray="10 6"/>
  <g font-family="Archivo, system-ui, sans-serif" font-size="16" font-weight="700">
    <text x="120" y="250" fill="#3cc2bc">image 1</text>
    <text x="570" y="418" fill="#f28c28" text-anchor="end">image 9</text>
  </g>
  <!-- Direction of travel -->
  <line x1="600" y1="300" x2="680" y2="300" stroke="#e6eff2" stroke-width="2"/>
  <path d="M680 292 L698 300 L680 308 Z" fill="#e6eff2"/>
  <text x="600" y="288" fill="#9bb8c6" font-family="Archivo, system-ui, sans-serif" font-size="14">déplacement</text>

  <!-- Dimensions under the footprints -->
  <g stroke="#e6eff2" stroke-width="1.5" fill="none">
    <line x1="120" y1="432" x2="120" y2="452"/><line x1="180" y1="432" x2="180" y2="452"/>
    <line x1="520" y1="432" x2="520" y2="452"/>
    <line x1="120" y1="446" x2="180" y2="446"/>
    <line x1="180" y1="446" x2="520" y2="446"/>
  </g>
  <g font-family="JetBrains Mono, ui-monospace, monospace" font-size="15" text-anchor="middle">
    <text x="150" y="472" fill="#9bb8c6">15 %</text>
    <text x="350" y="472" fill="#e6eff2" font-weight="700">85 % en commun</text>
  </g>

  <text x="32" y="504" fill="#9bb8c6" font-family="Archivo, system-ui, sans-serif" font-size="15">Plus le déplacement est rapide, plus l'intervalle entre les images gardées doit être court.</text>
</svg>
