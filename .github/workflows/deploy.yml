name: Deploy to GitHub Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  test-deploy:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          # Vite 8 (3D viewer) needs Node 20.19+ or 22.12+
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            viewer/package-lock.json
      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix viewer
      - name: Build the 3D viewer into static/modele
        run: npm run build:viewer
      - name: Test build website
        run: npm run build
  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          # Vite 8 (3D viewer) needs Node 20.19+ or 22.12+
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            viewer/package-lock.json
      - name: Deploy to GitHub Pages
        env:
          # The token GitHub provides to every workflow (permissions: contents: write) pushes to gh-pages:
          # no SSH key or personal secret needed
          GIT_USER: ${{ github.actor }}
          GIT_PASS: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "gh-actions"
          npm ci
          npm ci --prefix viewer
          # The viewer (lock21.info/modele/) is built into static/, which Docusaurus publishes as is
          npm run build:viewer
          npm run deploy
