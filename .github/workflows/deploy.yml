name: Deploy

# Deploys only on demand (Actions tab > "Deploy" > Run workflow, or `gh workflow run deploy.yml --ref <branch>`) or when
# a version tag is pushed (a release). Pushing or merging into main publishes nothing. Pull requests to main only run
# the build.
#
# Cloudflare (Workers static assets, wrangler.jsonc): a release or a manual run on main deploys the site; a manual run
# on another branch uploads a preview version with its own address (…workers.dev), lock21.info unchanged. Needs the
# repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (docs/installation.md).
# GitHub Pages: kept until lock21.info is switched to Cloudflare (same triggers, main and tags only).
on:
  pull_request:
    branches: [main]
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # Astro 7 and Vite 8 (3D viewer) need Node 22.12+
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            viewer/package-lock.json
      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix viewer
      # The viewer (lock21.info/modele/) is built into public/, which Astro copies as is
      - name: Build the 3D viewer into public/modele
        run: npm run build:viewer
      - name: Build the site
        run: npm run build

      # Cloudflare: production on a version tag or a manual run on main
      - name: Deploy to Cloudflare
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --message "${GITHUB_REF_NAME} ${GITHUB_SHA::7}"

      # Cloudflare: a preview of the branch on a manual run elsewhere than main (its address is printed in the log)
      - name: Preview on Cloudflare
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # A preview needs an existing Worker: the very first run creates it (only on …workers.dev while lock21.info
          # isn't routed to it)
          if ! npx wrangler deployments list > /dev/null 2>&1; then
            npx wrangler deploy --message "first deploy ${GITHUB_REF_NAME} ${GITHUB_SHA::7}"
          fi
          alias=$(echo "${GITHUB_REF_NAME}" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9\n' '-' | cut -c1-40)
          npx wrangler versions upload --preview-alias "$alias" --message "preview ${GITHUB_REF_NAME} ${GITHUB_SHA::7}"

      # GitHub Pages (until the switch to Cloudflare): publish dist/ on the gh-pages branch, which GitHub Pages serves.
      # The workflow's own token (permissions: contents: write) is enough.
      - name: Deploy to the gh-pages branch
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          rm -f _headers
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "gh-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
