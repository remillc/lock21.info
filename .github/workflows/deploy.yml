name: Deploy to GitHub Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Astro 7 and Vite 8 (3D viewer) need Node 22.12+
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            viewer/package-lock.json
      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix viewer
      # The viewer (lock21.info/modele/) is built into public/, which Astro copies as is
      - name: Build the 3D viewer into public/modele
        run: npm run build:viewer
      - name: Build the site
        run: npm run build
      # On pushes to main: publish dist/ on the gh-pages branch (GitHub Pages serves that branch). The workflow's own
      # token (permissions: contents: write) is enough: no SSH key or personal secret.
      - name: Deploy to the gh-pages branch
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "gh-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
